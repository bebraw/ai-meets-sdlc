      @font-face { font-family: "Finlandica Text"; src: url("../../fonts/FinlandicaText-Bold.woff2"); font-weight: 700; }
      text { fill: #f6f4ef; font-family: "Finlandica Text", sans-serif; }
      .headline { font-family: "Finlandica Headline", sans-serif; font-weight: 900; }
      .label { font-weight: 700; letter-spacing: 1px; }
    </style>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#f6f4ef" opacity=".13" /></pattern>
  </defs>
  <rect width="1200" height="630" fill="#101010" />
  <rect x="18" y="18" width="1164" height="594" fill="none" stroke="#f6f4ef" stroke-width="2" />
