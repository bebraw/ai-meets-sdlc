  <text x="144" y="108" font-size="18" fill-opacity=".65" data-safe="144 48 900 70">AI across the software development lifecycle</text>
  <text x="47" y="298" font-size="150" class="headline" data-safe="44 150 815 160">AI MEETS</text>
  <text x="47" y="446" font-size="150" class="headline" data-safe="44 300 815 160">SDLC.</text>
  <path d="M880 154V480" stroke="#f6f4ef" stroke-opacity=".4" />
