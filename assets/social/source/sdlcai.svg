<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">SDLCAI — AI meets SDLC</title>
  <desc id="description">Practical experience and research on AI across the software development lifecycle. Hear about the next seminar at sdlcai.org.</desc>
  <defs>
    <style>
      @font-face { font-family: "Finlandica Headline"; src: url("../../fonts/FinlandicaHeadline-Black.woff2"); font-weight: 900; }
