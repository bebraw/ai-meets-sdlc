<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1080"
  height="1080"
  viewBox="0 0 1080 1080"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">SDLCAI 2026 — AI meets SDLC</title>
  <desc id="description">
    A one-day seminar on AI across the full software development lifecycle. 13
    October 2026, Marsio, Aalto University, Espoo, Finland. Program and tickets
    at sdlcai.org.
  </desc>
  <defs>
    <style>
      @font-face {
        font-family: "Finlandica Headline";
        src: url("../../fonts/FinlandicaHeadline-Black.woff2") format("woff2");
        font-weight: 900;
      }
      @font-face {
        font-family: "Finlandica Text";
        src: url("../../fonts/FinlandicaText-Regular.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Finlandica Text";
        src: url("../../fonts/FinlandicaText-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      text {
        fill: #f6f4ef;
        font-family: "Finlandica Text", sans-serif;
      }
      .headline {
        font-family: "Finlandica Headline", sans-serif;
        font-weight: 900;
      }
      .label {
        font-weight: 700;
        letter-spacing: 2px;
      }
      .muted {
        fill: #b7b0a4;
      }
      .inverse {
        fill: #101010;
      }
    </style>
    <pattern id="halftone" width="14" height="14" patternUnits="userSpaceOnUse">
