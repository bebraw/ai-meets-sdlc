        font-family: "Finlandica Text";
        src: url("../../fonts/FinlandicaText-Bold.woff2") format("woff2");
        font-weight: 700;
      }
      text {
        fill: #f6f4ef;
        font-family: "Finlandica Text", sans-serif;
      }
      .headline {
        font-family: "Finlandica Headline", sans-serif;
        font-weight: 900;
      }
      .label {
        font-weight: 700;
        letter-spacing: 2px;
      }
      .muted {
