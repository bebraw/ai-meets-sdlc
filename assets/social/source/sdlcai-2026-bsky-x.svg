  <title id="title">SDLCAI 2026 — AI meets SDLC</title>
  <desc id="description">
    A one-day seminar on AI across the full software development lifecycle. 13
    October 2026, Marsio, Aalto University, Espoo, Finland. Program and tickets
    at sdlcai.org.
  </desc>
  <defs>
    <style>
      @font-face {
        font-family: "Finlandica Headline";
