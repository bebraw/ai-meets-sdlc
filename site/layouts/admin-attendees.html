<BaseLayout
  &title="(id 'SDLCAI Admin Attendees')"
  &description="(id 'Manage registrations and diets, prepare a catering summary, and track arrivals.')"
  &url="(id 'https://sdlcai.org/admin/attendees/')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation &current="(id 'attendees')"></AdminNavigation>
  <AdminPageHeader
    &eyebrow="(adminEyebrow (id 'attendees'))"
    &title="(id 'Attendees')"
    &description="(id 'Manage registrations and diets, prepare a catering summary, and track arrivals.')"
  ></AdminPageHeader>
  <section class="border-b border-ink px-5 py-10 md:px-8">
    <p class="mx-auto mb-6 max-w-7xl">
      <a
        class="inline-flex border border-ink px-4 py-3 text-sm font-bold uppercase hover:bg-ink hover:text-paper"
        href="/admin/attendee-messages/"
        >Send attendee messages</a
      >
    </p>
    <div class="mx-auto max-w-7xl" data-admin-attendees></div>
    <noscript>Enable JavaScript to manage registrations.</noscript>
  </section>
</BaseLayout>
