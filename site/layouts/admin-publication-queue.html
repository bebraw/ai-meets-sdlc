<BaseLayout
  &title="(id 'SDLCAI Publication Queue')"
  &description="(id 'Prepare and track the SDLCAI 2026 posts, announcement and newsletter.')"
  &url="(id 'https://sdlcai.org/admin/publication-queue/')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation &current="(id 'publication-queue')"></AdminNavigation>
  <AdminPageHeader
    &eyebrow="(id 'Admin / Post-production / 2026')"
    &title="(id 'Publication queue')"
    &description="(id 'Edit the copy, review it, and record where and when it is published.')"
  ></AdminPageHeader>
  <section class="border-b border-ink">
    <div class="mx-auto max-w-7xl px-5 py-6 md:px-8">
      <p class="max-w-3xl leading-7 text-muted">
        Prepare the copy here, then publish through your usual channel and
        record the result. Edits and tracking details are saved for the whole
        team.
      </p>
      <div class="mt-3 flex flex-wrap gap-x-6 gap-y-2 text-sm font-bold">
        <a
          href="/admin/content-inventory/"
          class="inline-flex min-h-11 items-center underline underline-offset-4"
          >Content inventory</a
        >
        <a
          href="/2026/talks/"
          class="inline-flex min-h-11 items-center underline underline-offset-4"
          >Published talk summaries</a
        >
      </div>
    </div>
  </section>
  <section class="border-b border-ink">
    <div
      class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12"
      data-publication-queue
    >
      <p role="status">Loading the publication queue…</p>
    </div>
    <noscript>Enable JavaScript to edit the publication queue.</noscript>
  </section>
</BaseLayout>
