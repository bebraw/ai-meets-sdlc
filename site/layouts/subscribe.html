<BaseLayout
  &title="(id 'SDLCAI News')"
  &description="(id 'Get SDLCAI news and hear about future events by email.')"
  &url="(id 'https://sdlcai.org/subscribe/')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <section class="relative border-b border-ink">
    <div
      class="absolute inset-y-0 right-0 hidden w-[42vw] text-ink/10 halftone-xl md:block"
    ></div>
    <div
      class="relative mx-auto grid max-w-7xl gap-10 px-5 py-16 md:grid-cols-2 md:px-8 md:py-24"
    >
      <div>
        <p class="font-headline text-sm font-black uppercase text-muted">
          Keep in touch
        </p>
        <h1
          class="mt-4 font-headline text-6xl font-black uppercase leading-none md:text-8xl"
        >
          SDLCAI<br />news
        </h1>
        <p class="mt-6 max-w-lg text-xl leading-8 text-muted">
          Hear about future SDLCAI events and news from the meeting point of AI
          and software development.
        </p>
      </div>
      <div
        class="grid content-center gap-6 border-t border-ink pt-6 md:border-l md:border-t-0 md:pl-10 md:pt-0"
      >
        <h2 class="font-headline text-3xl font-black uppercase">
          Hear about the next seminar
        </h2>
        <NewsletterSignup></NewsletterSignup>
      </div>
    </div>
  </section>
</BaseLayout>
