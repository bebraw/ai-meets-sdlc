<BaseLayout
  &title="(id 'SDLCAI Admin')"
  &description="(id 'Protected organizer tools for SDLCAI 2026.')"
  &ogDescription="(id 'Protected organizer tools for SDLCAI 2026.')"
  &url="(id 'https://sdlcai.org/admin/')"
  &ogType="(id 'website')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation &current="(id '')"></AdminNavigation>
  <AdminPageHeader
    &eyebrow="(id 'Admin / Control room')"
    &title="(id 'Admin desk')"
    &description="(id 'Prepare the people and program, run the event, and coordinate hospitality. Choose a workspace below or switch with All workspaces.')"
  ></AdminPageHeader>
  <div class="bg-ink text-paper">
    <noop &foreach="(adminWorkspaceGroups) as adminGroup">
      <section
        class="border-b border-paper/30 px-5 py-8 md:px-8 md:py-10"
        &aria-labelledby="adminGroup.id"
        data-admin-workspace-group
      >
        <div
          class="mx-auto grid min-w-0 max-w-7xl gap-6 lg:grid-cols-[18rem_minmax(0,1fr)] lg:gap-10"
        >
          <div>
            <h2
              class="font-headline text-3xl font-black uppercase leading-none md:text-4xl"
              &id="adminGroup.id"
              &children="adminGroup.label"
            ></h2>
            <p
              class="mt-3 max-w-sm text-sm leading-6 text-paper/70"
              &children="adminGroup.description"
            ></p>
          </div>
          <ul
            class="grid min-w-0 gap-px border border-paper/30 bg-paper/30 md:grid-cols-2"
          >
            <noop &foreach="adminGroup.items as workspace">
              <li class="min-w-0 bg-ink">
                <a
                  class="group flex h-full min-w-0 items-start justify-between gap-4 p-5 transition hover:bg-paper hover:text-ink focus-visible:relative focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-[-2px] focus-visible:outline-paper md:p-6"
                  &href="workspace.href"
                >
                  <span class="grid min-w-0 gap-3">
                    <span
                      class="font-headline text-2xl font-black uppercase leading-none md:text-3xl"
                      &children="workspace.label"
                    ></span>
                    <span
                      class="text-sm leading-6 text-paper/70 transition group-hover:text-muted group-focus-visible:text-muted"
                      &children="workspace.description"
                    ></span>
                  </span>
                  <svg
                    class="h-5 w-5 shrink-0"
                    viewBox="0 0 16 16"
                    aria-hidden="true"
                  >
                    <path
                      d="M3 8h10m-4-4 4 4-4 4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                    ></path>
                  </svg>
                </a>
              </li>
            </noop>
          </ul>
        </div>
      </section>
    </noop>
  </div>
</BaseLayout>
