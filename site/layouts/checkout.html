<BaseLayout
  &title="(id 'SDLCAI / Sold out')"
  &description="(id 'SDLCAI 2026 is sold out and ticket sales are closed. Watch the seminar live on YouTube.')"
  &ogDescription="(id 'All in-person tickets have been sold. Join the SDLCAI livestream on 13 October 2026.')"
  &url="(id 'https://sdlcai.org/checkout/')"
  &ogType="(id 'website')"
>
  <section class="border-b border-ink">
    <div class="mx-auto max-w-5xl px-5 py-12 md:px-8 md:py-20">
      <p
        class="font-headline text-sm font-black uppercase text-muted"
        &children="seminar.display.dateShortVenueLocation"
      ></p>
      <h1
        class="mt-3 font-headline text-6xl font-black uppercase leading-none md:text-8xl"
      >
        Sold out
      </h1>
      <p class="mt-6 max-w-3xl text-xl leading-8">
        All in-person tickets for SDLCAI 2026 have been sold. Ticket sales are
        closed.
      </p>
      <p class="mt-4 max-w-3xl text-xl leading-8 text-muted">
        You can still follow the seminar live on YouTube on 13 October 2026.
      </p>
      <div class="mt-8 flex flex-wrap gap-3">
        <a
          class="inline-flex min-h-11 items-center border border-ink bg-ink px-5 py-3 text-base font-bold uppercase text-paper transition hover:bg-paper hover:text-ink"
          href="https://youtube.com/live/d7POyy6dYFI"
          >Watch live on YouTube</a
        >
        <a
          class="inline-flex min-h-11 items-center border border-ink px-5 py-3 text-base font-bold uppercase transition hover:bg-ink hover:text-paper"
          href="/schedule/"
          >See the program</a
        >
      </div>
    </div>
  </section>
</BaseLayout>
