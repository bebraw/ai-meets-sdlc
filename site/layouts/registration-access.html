<BaseLayout
  &title="(id 'SDLCAI Registration Access')"
  &description="(id 'Sign in with your private registration staff link.')"
  &url="(id 'https://sdlcai.org/registration/access/')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminPageHeader
    &eyebrow="(id 'SDLCAI / Staff access')"
    &title="(id 'Registration')"
    &description="(id 'Use the private link an organizer shared with you to open the registration desk.')"
  ></AdminPageHeader>
  <section class="border-b border-ink px-5 py-10 md:px-8">
    <div class="mx-auto max-w-xl" data-registration-access></div>

      >Enable JavaScript and reopen your staff link to sign in.</noscript
    >
  </section>
</BaseLayout>
