<BaseLayout
  &title="block.title"
  &description="block.description"
  &ogDescription="block.description"
  &url="block.url"
  &ogType="(id 'article')"
>
  <div class="border-b border-ink">
    <nav
      aria-label="Toolkit"
      class="mx-auto flex max-w-7xl flex-wrap items-center gap-x-4 px-5 py-2 text-sm md:px-8"
    >
      <a
        href="/toolkit/#blocks"
        class="inline-flex min-h-11 items-center gap-2 font-bold underline underline-offset-4"
      >
        <span aria-hidden="true" class="toolkit-chevron toolkit-back"></span>
        All toolkit blocks
      </a>
      <span aria-hidden="true" class="hidden text-muted sm:inline">/</span>
      <span class="text-muted" &children="block.group"></span>
    </nav>
  </div>
  <article>
    <div
      class="mx-auto grid max-w-7xl items-start gap-x-14 gap-y-9 px-5 py-9 md:px-8 lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.15fr)] lg:grid-rows-[max-content_1fr] lg:py-14"
    >
      <header class="toolkit-intro min-w-0">
        <h1
          class="toolkit-title font-headline font-black uppercase leading-[0.96]"
          &style="block.titleStyle"
          &children="block.name"
        ></h1>
        <p
          class="mt-5 max-w-xl text-xl leading-snug md:text-2xl"
          &children="block.description"
        ></p>
      </header>
      <section
        class="toolkit-workbench min-w-0 border border-ink lg:col-start-2 lg:row-span-2 lg:row-start-1"
        aria-labelledby="example-title"
      >
        <div class="border-b border-ink px-5 py-4 md:px-7 md:py-5">
          <p class="mb-2 flex items-center gap-2 text-sm font-bold text-muted">
            <span aria-hidden="true" class="h-2 w-2 bg-signal"></span
            >Interactive example
          </p>
          <h2
            id="example-title"
            class="font-headline text-3xl font-black leading-tight md:text-4xl"
            &children="block.demoTitle"
          ></h2>
          <p class="mt-2 max-w-xl leading-snug" &children="block.demoIntro"></p>
        </div>
        <div
          class="toolkit-demo px-5 py-5 md:px-7"
          &data-toolkit-demo="block.id"
        ></div>
        <noscript
          ><p class="px-5 pb-5">
            Enable JavaScript to try the example in your browser.
          </p></noscript
        >
        <div
          class="flex flex-wrap items-center justify-between gap-x-4 border-t border-ink/25 px-5 py-2 text-sm md:px-7"
        >
          <p class="text-muted">Sample data stays in this tab.</p>
          <button
            hidden
            type="button"
            data-reset-demo
            class="min-h-11 font-bold underline underline-offset-4"
          >
            Reset example
          </button>
        </div>
      </section>
      <section
        class="min-w-0 border-t-2 border-ink pt-4 lg:col-start-1 lg:row-start-2"
        aria-labelledby="actions-heading"
      >
        <h2
          id="actions-heading"
          class="font-headline text-2xl font-black uppercase"
        >
          What you can do
        </h2>
        <ul
          class="mt-3 list-disc space-y-2 pl-5 leading-snug marker:text-muted"
        >
          <noop &foreach="block.actions as action"
            ><li &children="action"></li
          ></noop>
        </ul>
        <dl class="mt-6 grid gap-4 border-t border-ink/25 pt-4">
          <div>
            <dt class="font-bold">Start with</dt>
            <dd class="mt-1 leading-snug" &children="block.input"></dd>
          </div>
          <div>
            <dt class="font-bold">What you get</dt>
            <dd class="mt-1 leading-snug" &children="block.output"></dd>
          </div>
        </dl>
      </section>
    </div>
    <section class="border-y border-ink">
      <div
        class="mx-auto grid max-w-7xl gap-7 px-5 py-8 md:px-8 lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.15fr)] lg:gap-14"
      >
        <div class="min-w-0">
          <h2 class="font-headline text-2xl font-black uppercase">
            Use it at your event
          </h2>
          <p class="mt-2 max-w-lg leading-snug">
            In your toolkit checkout, enable this block before starting the
            organizer workspace or MCP server.
          </p>
          <code
            class="mt-3 block break-all border-l-4 border-signal bg-ink p-3 text-sm text-paper"
            &children="block.enableCommand"
          ></code>
          <a
            href="/toolkit/#setup"
            class="mt-2 inline-flex min-h-11 items-center font-bold underline underline-offset-4"
            >Workspace setup</a
          >
        </div>
        <div class="min-w-0">
          <details class="border-y border-ink/35">
            <summary
              class="flex min-h-14 cursor-pointer items-center justify-between gap-3 py-3 font-bold"
            >
              <span>Operations and access</span
              ><span class="text-sm text-muted"
                ><span &children="block.operationLabel"></span>
                <span
                  aria-hidden="true"
                  class="toolkit-chevron toolkit-disclosure"
                ></span
              ></span>
            </summary>
            <p
              &visibleIf="block.accessNote"
              class="pb-3 text-sm leading-snug"
              &children="block.accessNote"
            ></p>
            <dl class="divide-y divide-ink/25">
              <noop &foreach="block.operations as operation">
                <div class="border-t border-ink/25 py-3">
                  <dt>
                    <code
                      class="break-all text-sm font-bold"
                      &children="operation.name"
                    ></code>
                  </dt>
                  <dd
                    class="mt-1 leading-snug"
                    &children="operation.description"
                  ></dd>
                  <dd
                    class="mt-2 text-sm text-muted"
                    &children="operation.roles"
                  ></dd>
                </div>
              </noop>
            </dl>
          </details>
        </div>
      </div>
    </section>
    <section class="mx-auto max-w-7xl px-5 py-8 md:px-8 md:py-12">
      <h2 class="font-headline text-2xl font-black uppercase">
        Related blocks
      </h2>
      <ul class="mt-4 grid gap-x-8 gap-y-4 sm:grid-cols-2 lg:grid-cols-3">
        <noop &foreach="block.related as related">
          <li class="border-t border-ink/35 pt-2">
            <a
              class="inline-flex min-h-11 items-center gap-2 font-bold underline underline-offset-4"
              &href="related.href"
              ><span &children="related.name"></span
              ><span aria-hidden="true" class="toolkit-chevron"></span
            ></a>
            <p
              class="max-w-sm text-sm leading-snug text-muted"
              &children="related.description"
            ></p>
          </li>
        </noop>
      </ul>
    </section>
  </article>
</BaseLayout>
