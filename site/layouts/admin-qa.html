<BaseLayout
  &title="(id 'SDLCAI Admin QA')"
  &description="(id 'Manage audience question rooms and moderator and MC access.')"
  &ogDescription="(id 'Private SDLCAI QA control desk.')"
  &url="(id 'https://sdlcai.org/admin/qa/')"
  &ogType="(id 'website')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation &current="(id 'qa')"></AdminNavigation>
  <section class="border-b border-ink">
    <div class="mx-auto grid max-w-7xl gap-5 px-5 py-10 md:px-8 md:py-14">
      <div>
        <p
          class="font-headline text-sm font-black uppercase text-muted"
          &children="(adminEyebrow (id 'qa'))"
        ></p>
        <h1
          class="mt-3 font-headline text-5xl font-black uppercase leading-none md:text-7xl"
        >
          Q&A control desk
        </h1>
      </div>
      <p class="max-w-3xl text-xl leading-8 text-muted">
        Select a session, open questions, and share reusable moderator and MC
        access links.
      </p>
      <div class="flex flex-wrap gap-3">
        <a
          class="border border-ink px-4 py-3 font-bold uppercase hover:bg-ink hover:text-paper"
          href="/qa/"
          >Audience view</a
        ><a
          class="border border-ink px-4 py-3 font-bold uppercase hover:bg-ink hover:text-paper"
          href="/qa/screen/"
          target="_blank"
          rel="noopener"
          >Audience screen</a
        ><a
          class="border border-ink px-4 py-3 font-bold uppercase hover:bg-ink hover:text-paper"
          href="/qa/present/"
          target="_blank"
          rel="noopener"
          >Question queue</a
        >
      </div>
      <p
        class="text-sm text-muted"
        role="status"
        aria-live="polite"
        data-qa-connection
      ></p>
    </div>
  </section>
  <section class="border-b border-ink">
    <div
      class="mx-auto min-w-0 max-w-7xl px-5 py-8 md:px-8 md:py-12"
      data-qa-content
    >
      <p class="text-muted">
        The Q&A control desk will appear here on the event site.
      </p>
    </div>
  </section>
</BaseLayout>
