<BaseLayout
  &title="(id 'SDLCAI Administration')"
  &description="(id 'Shared SDLCAI tools and event workspaces.')"
  &ogDescription="(id 'Shared SDLCAI tools and event workspaces.')"
  &ogType="(id 'website')"
  &url="(id 'https://sdlcai.org/admin/')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation &current="(id '')"></AdminNavigation>
  <AdminPageHeader
    &eyebrow="(id 'SDLCAI / Shared administration')"
    &title="(id 'Admin desk')"
    &description="(id 'Manage SDLCAI news across events, or open an event workspace for its people, programme and production work.')"
  ></AdminPageHeader>
  <section class="border-b border-ink px-5 py-10 md:px-8">
    <div class="mx-auto grid max-w-7xl gap-6 md:grid-cols-[18rem_1fr]">
      <h2 class="font-headline text-3xl font-black uppercase">Shared tools</h2>
      <a
        class="block border border-ink p-6 hover:bg-ink hover:text-paper"
        href="/admin/newsletter/"
      >
        <span class="font-headline text-3xl font-black uppercase"
          >SDLCAI news</span
        >
        <span class="mt-3 block leading-7"
          >Subscribers, consent, unsubscribe history and mailing provider sync
          across events.</span
        >
      </a>
    </div>
  </section>
  <section class="px-5 py-10 md:px-8">
    <div class="mx-auto grid max-w-7xl gap-6 md:grid-cols-[18rem_1fr]">
      <div>
        <h2 class="font-headline text-3xl font-black uppercase">
          Event workspaces
        </h2>
        <p class="mt-3 leading-7 text-muted">
          Each event keeps its own records and saved selections.
        </p>
      </div>
      <ul class="grid gap-4" data-admin-events></ul>
    </div>
  </section>
</BaseLayout>
