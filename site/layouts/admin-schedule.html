<BaseLayout
  &title="(id 'SDLCAI Admin Schedule')"
  &description="(id 'Arrange talks within and between sessions.')"
  &ogDescription="(id 'Private SDLCAI schedule editor.')"
  &url="(id 'https://sdlcai.org/admin/schedule/')"
  &ogType="(id 'website')"
  &robots="(id 'noindex,nofollow,noarchive')"
>
  <AdminNavigation></AdminNavigation>
  <section class="border-b border-ink">
    <div class="mx-auto grid max-w-7xl gap-5 px-5 py-12 md:px-8 md:py-16">
      <div>
        <p class="font-headline text-sm font-black uppercase text-muted">
          Admin / Running order
        </p>
        <h1
          class="mt-3 font-headline text-5xl font-black uppercase leading-none md:text-7xl"
        >
          Schedule
        </h1>
      </div>
      <p class="max-w-3xl text-xl leading-8 text-muted">
        Drag talks into order or move them to another session. Save when the
        running order is ready.
      </p>
    </div>
  </section>
  <section data-admin-schedule class="border-b border-ink">
    <div
      class="sticky top-0 z-20 border-b border-ink bg-paper px-5 py-4 md:px-8"
    >
      <div
        class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4"
      >
        <div>
          <p
            class="font-bold"
            role="status"
            aria-live="polite"
            data-schedule-status
          >
            Loading schedule…
          </p>
          <p class="mt-1 text-sm text-muted">
            Session times stay fixed. Changes go live only when saved.
          </p>
        </div>
        <div class="flex flex-wrap gap-3">
          <button
            type="button"
            data-schedule-reload
            class="border border-ink px-4 py-3 text-sm font-bold uppercase disabled:opacity-50"
          >
            Reload published
          </button>
          <button
            type="button"
            data-schedule-save
            disabled
            class="border border-ink bg-ink px-5 py-3 text-sm font-bold uppercase text-paper disabled:opacity-50"
          >
            Save changes
          </button>
        </div>
      </div>
    </div>
    <div class="mx-auto max-w-7xl px-5 py-10 md:px-8 md:py-14">
      <p class="mb-6 text-sm leading-6 text-muted">
        You can also use the Up / Down buttons and session selector to move a
        talk.
      </p>
      <div
        class="grid items-start gap-8 lg:grid-cols-2"
        data-schedule-board
        aria-busy="true"
      ></div>
      <noscript><p>Enable JavaScript to arrange the schedule.</p></noscript>
    </div>
  </section>
</BaseLayout>
