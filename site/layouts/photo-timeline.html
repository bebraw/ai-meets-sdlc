<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SDLCAI — A day in frames</title>
    <link rel="canonical" href="https://sdlcai.org/2026/timeline/" />
    <meta
      name="description"
      content="Relive SDLCAI 2026 in photographs. Follow the day from arrivals to after hours, or explore speakers, talks and topics. Photos shared under CC BY 4.0."
    />
    <meta property="og:title" content="SDLCAI — A day in frames" />
    <meta
      property="og:description"
      content="A photographic timeline of SDLCAI 2026. Explore the talks, panels and conversations from Marsio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sdlcai.org/2026/timeline/" />
    <meta property="og:image" content="https://sdlcai.org/og.png?v=20261018" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://sdlcai.org/og.png?v=20261018" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/FinlandicaHeadline-Black.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/photo-timeline/styles.css" />
    <script>
      (() => {
        let theme = "light";
        try {
          const stored = localStorage.getItem("sdlcai-theme");
          theme =
            stored === "dark" || stored === "light"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-bar">
      <a class="brand" href="/" aria-label="SDLCAI home">
        <img
          src="/assets/logo.svg"
          alt="SDLCAI"
          width="160"
          height="160"
          loading="lazy"
          decoding="async"
        />
      </a>
      <nav aria-label="Photos">
        <a href="/2026/">2026 archive</a>
        <a href="/2026/timeline/" aria-current="page">Timeline</a>
        <a href="/2026/photos/">Media bank</a>
        <a href="/2026/schedule/">Schedule</a>
        <a href="/2026/speakers/">Speakers</a>
      </nav>
      <button
        class="theme-button"
        id="theme"
        type="button"
        aria-label="Toggle dark mode"
      >
        Dark mode
      </button>
    </header>
    <main id="main" tabindex="-1" aria-busy="true">
      <div class="loading">
        <span class="eyebrow">SDLCAI / 13 October 2026</span>
        <h1>A day<br />in frames.</h1>
        <p role="status">Opening the photo collection…</p>
        <noscript
          ><p>
            Enable JavaScript to explore the timeline. You can also
            <a href="/api/photos/credits">download photographer credits</a> or
            <a href="/2026/schedule/">read the programme</a>.
          </p></noscript
        >
      </div>
    </main>
    <script type="module" src="/assets/photo-timeline/app.js"></script>
  </body>
</html>
