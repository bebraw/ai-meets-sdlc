<BaseLayout
  &title="(id 'SDLCAI Schedule')"
  &description="(id 'Talks, slides, recordings, and the programme from SDLCAI, a seminar on AI across the software development lifecycle.')"
  &ogDescription="(id 'Explore the talks and materials from SDLCAI on 13 October 2026 at Aalto University.')"
  &url="(id 'https://sdlcai.org/schedule/')"
  &ogType="(id 'website')"
>
  <section class="relative border-b border-ink">
    <div
      class="absolute -left-20 top-20 h-72 w-72 rounded-full border border-ink/20 text-ink/15 halftone"
    ></div>
    <div class="relative mx-auto max-w-7xl px-5 py-12 md:px-8 md:py-16">
      <div class="min-w-0">
        <p
          class="font-headline text-sm font-black uppercase text-muted"
          &children="seminar.display.dateShortVenueLocation"
        ></p>
        <h1
          class="mt-3 font-headline text-[clamp(4rem,16vw,13rem)] font-black uppercase leading-[0.74]"
        >
          Schedule
        </h1>
      </div>
      <div
        class="mt-8 grid gap-6 border-y border-ink py-6 md:ml-auto md:max-w-3xl"
      >
        <p class="max-w-3xl text-xl leading-8 text-muted">
          Revisit the talks from SDLCAI. Find slides and supporting resources,
          with recordings to follow.
        </p>
        <div class="flex flex-wrap gap-3">
          <a
            class="inline-flex border border-ink bg-ink px-5 py-3 text-base font-bold uppercase text-paper transition hover:bg-paper hover:text-ink"
            href="#talk-materials"
            >Browse materials</a
          >
          <a
            class="inline-flex border border-ink px-5 py-3 text-base font-bold uppercase transition hover:bg-ink hover:text-paper"
            href="#day-flow"
            >Programme</a
          >
        </div>
      </div>
    </div>
  </section>

  <TalkMaterials></TalkMaterials>

  <section class="border-b border-ink">
    <div
      class="mx-auto grid max-w-7xl gap-8 px-5 py-16 md:px-8 lg:grid-cols-[14rem_1fr]"
    >
      <div>
        <p class="font-headline text-sm font-black uppercase text-muted">
          Seminar day
        </p>
        <SectionHeading
          &title="(id 'Programme')"
          &href="(id '#day-flow')"
          &ariaLabel="(id 'Link to programme section')"
          &className="(id 'mt-3 flex items-start gap-3 font-headline text-5xl font-black uppercase leading-none md:text-7xl')"
          &anchorClassName="(id 'mt-[0.06em] inline-flex min-h-6 min-w-6 shrink-0 items-center justify-center text-[0.45em] leading-none text-muted transition hover:text-ink focus-visible:outline focus-visible:outline-2 focus-visible:outline-ink')"
        ></SectionHeading>
      </div>
      <SeminarSchedule
        &id="(id 'day-flow')"
        &className="(id 'grid border border-ink')"
      ></SeminarSchedule>
    </div>
  </section>
</BaseLayout>
