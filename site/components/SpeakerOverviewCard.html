<li
  class="min-w-0 border border-ink bg-paper"
  &data-schedule-talk="speaker.talk.id"
  &data-home-speaker-id="speaker.id"
>
  <a
    &href="speaker.speakerHref"
    class="group flex h-full min-w-0 flex-col transition hover:bg-ink hover:text-paper focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-ink"
  >
    <img
      &src="speaker.photo"
      &alt="speaker.name"
      &data-canonical-speaker-id="speaker.id"
      data-canonical-speaker-photo
      class="aspect-square w-full border-b border-ink object-cover object-top grayscale transition duration-300 group-hover:grayscale-0 group-focus-visible:grayscale-0"
      width="500"
      height="500"
      loading="lazy"
      decoding="async"
    />
    <div class="flex min-w-0 flex-1 flex-col gap-3 p-3 sm:p-4">
      <h4
        class="break-words font-headline text-xl font-black uppercase leading-none sm:text-2xl"
        &children="speaker.displayName"
        &data-canonical-speaker-id="speaker.id"
        data-canonical-speaker-name
      ></h4>
      <p
        class="break-words text-xs leading-5 opacity-75 sm:text-sm sm:leading-6"
        &children="speaker.affiliation"
        &data-canonical-speaker-id="speaker.id"
        data-canonical-speaker-affiliation
      ></p>
      <p
        class="border-t border-current/25 pt-3 text-sm font-bold leading-5 sm:text-base sm:leading-6"
        &children="speaker.talk.title"
        &data-canonical-talk-id="speaker.talk.id"
        data-canonical-talk-title
      ></p>
      <span
        class="mt-auto flex items-center justify-between gap-2 pt-2 text-xs font-bold uppercase"
      >
        Profile &amp; talk
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path d="M4 10h12M11 5l5 5-5 5" />
        </svg>
      </span>
    </div>
  </a>
</li>
